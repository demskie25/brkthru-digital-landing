<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enneagram Assessment for Leaders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-[#fdfbf6] text-slate-900">
    <div class="max-w-4xl mx-auto mt-20 p-10 bg-[#4A148C] rounded-3xl shadow-2xl border-4 border-[#B8860B]">
        <div x-data="{ hasFinished: false }">

            <div x-show="!hasFinished" class="text-center">
                <h1 class="text-5xl font-black text-[#FFD700] mb-6 uppercase tracking-tighter">Leader Intelligence</h1>
                <p class="text-white text-xl mb-10 opacity-80 font-medium italic">"The quality of your leadership is
                    limited by the quality of your self-awareness."</p>

                <div class="bg-white/5 p-8 rounded-2xl border border-white/10 mb-10 text-left">
                    <p class="text-white text-lg leading-relaxed">This 16-page diagnostic reveals your core cognitive
                        style. Please allow 15 minutes of quiet focus.</p>
                </div>

                <button @click="hasFinished = true"
                    class="w-full bg-[#ADFF2F] text-[#000080] font-black py-8 rounded-2xl text-3xl shadow-[0_20px_50px_rgba(173,255,47,0.3)] hover:scale-[1.02] transition-transform">
                    BEGIN ASSESSMENT
                </button>
            </div>

            <div x-show="hasFinished" x-cloak class="bg-white p-10 rounded-2xl shadow-inner">
                <h2 class="text-4xl font-black text-[#4A148C] mb-2 text-center">Report Ready!</h2>
                <p class="text-center text-slate-400 mb-10">Your full leadership profile has been generated.</p>

                <div class="flex flex-col gap-6">
                    <a href="mailto:?subject=My Leadership Report&body=Link to my report: "
                        class="w-full bg-orange-600 text-white font-black py-6 rounded-2xl text-center text-xl shadow-lg flex items-center justify-center gap-3">
                        📧 EMAIL LINK TO MY DESKTOP
                    </a>

                    <button onclick="alert('Saving image...')"
                        class="w-full border-2 border-[#4A148C] text-[#4A148C] font-black py-6 rounded-2xl text-xl">
                        📸 SAVE TO PHONE (PNG)
                    </button>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
