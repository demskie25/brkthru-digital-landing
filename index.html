<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Intelligence Assessment</title>
    <style>
        body {
            background-color: #fdfbf6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .box {
            background-color: #4A148C;
            color: white;
            padding: 40px;
            border-radius: 20px;
            border: 5px solid #B8860B;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #FFD700;
            font-size: 40px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        p {
            font-style: italic;
            opacity: 0.9;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            background-color: #ADFF2F;
            color: #000080;
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Leader Intelligence</h1>
        <p>"Revealing the cognitive machinery of leadership."</p>
        <a href="?start=true" class="btn">BEGIN ASSESSMENT</a>
    </div>
</body>

</html>
