<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enneagram Assessment for Leaders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="bg-[#fdfbf6] text-slate-900">

    <div class="max-w-4xl mx-auto mt-12 p-8 bg-[#4A148C] rounded-3xl shadow-2xl border-4 border-[#B8860B]">
        <div x-data="{ hasFinished: false, currentStep: 'intro' }">

            <div x-show="currentStep === 'intro' && !hasFinished" class="text-center py-10">
                <h1 class="text-5xl font-black text-[#FFD700] mb-6 uppercase tracking-tight">Leader Intelligence</h1>
                <p class="text-white text-xl mb-10 opacity-90 italic">"Revealing the cognitive machinery of leadership."
                </p>

                <button @click="currentStep = 'quiz'"
                    class="w-full bg-[#ADFF2F] text-[#000080] font-black py-8 rounded-2xl text-3xl shadow-xl hover:scale-[1.02] transition-transform">
                    BEGIN ASSESSMENT
                </button>
            </div>

            <div x-show="currentStep === 'quiz' && !hasFinished" class="bg-white p-10 rounded-2xl text-center">
                <h2 class="text-2xl font-bold mb-6">Assessment in Progress...</h2>
                <button @click="hasFinished = true" class="text-slate-400 underline">Simulate Finish</button>
            </div>

            <div x-show="hasFinished" class="bg-white p-10 rounded-2xl shadow-inner">
                <h2 class="text-4xl font-black text-[#4A148C] mb-4 text-center">Report Ready!</h2>

                <div class="flex flex-col gap-6 mt-8">
                    <a href="mailto:?subject=My Leadership Report&body=Check your report link here: "
                        class="w-full bg-orange-600 text-white font-black py-6 rounded-2xl text-center text-xl shadow-lg flex items-center justify-center gap-3">
                        <i class="fa-solid fa-envelope"></i> EMAIL LINK TO MY DESKTOP
                    </a>

                    <button onclick="window.print()"
                        class="w-full border-2 border-[#4A148C] text-[#4A148C] font-black py-6 rounded-2xl text-xl flex items-center justify-center gap-3">
                        <i class="fa-solid fa-file-pdf"></i> SAVE AS PDF / PRINT
                    </button>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
