<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Purchase | Brkthru Coaching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brkthru-blue { color: #1e40af; }
        .bg-brkthru-blue { background-color: #1e40af; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans leading-relaxed text-gray-900">

    <div id="checkout-card" class="max-w-xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100 transition-all duration-700 opacity-0 transform translate-y-8">
        
        <div class="p-10 text-center border-b border-gray-50 bg-white">
            <img src="https://img-thumb.mailinblue.com/10571077/images/content_library/original/69804be067454159afb8d239.jpeg" alt="Brkthru Logo" class="h-12 mx-auto mb-6">
            <h1 class="text-3xl font-black tracking-tight">Review Your Order</h1>
            <p class="text-gray-500 mt-2 font-medium">Your coaching breakthrough starts here.</p>
        </div>

        <div class="px-10 pb-10">
            <div class="bg-gray-50 rounded-[2rem] p-8 flex flex-col md:flex-row items-center gap-8 mt-8 border border-gray-100">
                <div class="relative">
                    <img id="product-image" src="" alt="Book Cover" class="w-36 h-auto rounded-lg shadow-[0_20px_50px_rgba(0,0,0,0.2)] transform -rotate-2">
                </div>
                
                <div class="text-center md:text-left">
                    <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold uppercase tracking-widest rounded-full mb-3">Instant Access</span>
                    <h2 id="display-title" class="text-2xl font-bold leading-tight mb-2"></h2>
                    <p class="text-gray-500 text-sm font-medium">Professional Ebook Edition (PDF)</p>
                </div>
            </div>

            <div class="mt-10 pt-8 border-t border-gray-100 flex justify-between items-end">
                <div>
                    <p class="text-gray-400 text-sm font-bold uppercase tracking-widest mb-1">Total Investment</p>
                    <p class="text-gray-400 text-xs italic">Includes all future updates</p>
                </div>
                <div class="text-right">
                    <span class="text-4xl font-black" id="product-price"></span>
                </div>
            </div>

            <a id="pay-link" href="" class="group relative block w-full bg-brkthru-blue hover:bg-blue-800 text-white text-center font-bold py-6 rounded-2xl shadow-xl transition-all duration-300 transform active:scale-[0.98] mt-10 text-xl overflow-hidden">
                <span class="relative z-10 text-white !important">Complete Secure Checkout</span>
            </a>

            <div class="mt-8 flex justify-center items-center gap-6">
                <div class="flex items-center gap-2 text-gray-400 text-[10px] font-bold uppercase tracking-[0.2em]">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span> Secure Encryption
                </div>
                <div class="w-px h-4 bg-gray-200"></div>
                <div class="text-gray-400 text-[10px] font-bold uppercase tracking-[0.2em]">
                    Instant Delivery
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = {
            'bundle': {
                name: 'The Twin Bundle: World-Class Coach + Toolkit',
                price: 'PHP 649.00',
                img: 'https://img-thumb.mailinblue.com/10571077/images/content_library/original/69804bc7b474d6eac960eccf.jpeg',
                link: 'https://hitpay.link/n6dx11'
            },
            'book': {
                name: 'World-Class Coach (10th Anniversary)',
                price: 'PHP 199.00',
                img: 'https://img-thumb.mailinblue.com/10571077/images/content_library/original/69804bc667454159afb8d237.jpeg',
                link: 'https://hitpay.link/mhy8sc'
            },
            'toolkit': {
                name: 'The Coaching Field Toolkit',
                price: 'PHP 199.00',
                img: 'https://img-thumb.mailinblue.com/10571077/images/content_library/original/69804bc73dad4cc88c5856e7.jpeg',
                link: 'https://hitpay.link/9zlbvf'
            }
        };

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const itemKey = params.get('item') || 'bundle';
            const product = products[itemKey];

            if (product) {
                document.getElementById('display-title').innerText = product.name;
                document.getElementById('product-price').innerText = product.price;
                document.getElementById('product-image').src = product.img;
                document.getElementById('pay-link').href = product.link;
                
                const card = document.getElementById('checkout-card');
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }
        };
    </script>
</body>
</html>
